<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}기회 챙김{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar">
      <div class="brand">🌱 기회 챙김</div>
      <a href="{{ url_for('dashboard.index') }}" class="{{ 'active' if request.endpoint == 'dashboard.index' }}">
        <span>📊</span> 대시보드
      </a>
      <a href="{{ url_for('newsletters.index') }}" class="{{ 'active' if request.blueprint == 'newsletters' }}">
        <span>📰</span> 뉴스레터
      </a>
      <a href="{{ url_for('goals.index') }}" class="{{ 'active' if request.blueprint == 'goals' }}">
        <span>🎯</span> 내 목표
      </a>
      <a href="{{ url_for('schedule.index') }}" class="{{ 'active' if request.blueprint == 'schedule' }}">
        <span>🗓️</span> 일정
      </a>
    </nav>

    <main class="content">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack">
            {% for category, message in messages %}
              <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
